{{- if .Values.ingress.enabled -}}
{{- $fullName := include "tinycrm.fullname" . -}}
{{- $tlsSecret := printf "%s-tls" $fullName -}}
# Replaces the host Caddy from the compose deployment. Its two rules map
# straight over: /api/* strips the prefix and goes to the backend, everything
# else goes to the frontend.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-strip-api
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
{{- /*
Extra Traefik middlewares, off by default. Staging turns both on so a
non-production copy neither shows up in search results nor opens to anyone who
guesses the hostname.
*/}}
{{- $frontendMiddlewares := list }}
{{- $apiMiddlewares := list (printf "%s-%s-strip-api@kubernetescrd" .Release.Namespace $fullName) }}
{{- if .Values.ingress.noindex }}
{{- $ref := printf "%s-%s-noindex@kubernetescrd" .Release.Namespace $fullName }}
{{- $frontendMiddlewares = append $frontendMiddlewares $ref }}
{{- $apiMiddlewares = append $apiMiddlewares $ref }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-noindex
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
---
{{- end }}
{{- with .Values.ingress.basicAuth.secretName }}
{{- $frontendMiddlewares = append $frontendMiddlewares (printf "%s-%s-basic-auth@kubernetescrd" $.Release.Namespace $fullName) }}
# The frontend only. The API already authenticates every request with its own
# JWT in the Authorization header — the same header basic auth needs — so a
# basic-auth gate on /api would reject every logged-in call.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-basic-auth
  labels:
    {{- include "tinycrm.labels" $ | nindent 4 }}
spec:
  basicAuth:
    # htpasswd lines under the key `users`, created by hand — deploy/README.md.
    secret: {{ . }}
    removeHeader: true
---
{{- end }}
# Two Ingress objects, not one with two paths: Traefik's router.middlewares
# annotation applies to every route in the Ingress it sits on, so a single
# object would strip /api from the frontend's routes as well.
#
# This one owns the certificate — it carries the cert-manager annotation, and
# the API Ingress below only references the Secret it produces. Annotating both
# would have cert-manager reconcile two Certificates onto one Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with $frontendMiddlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-frontend
                port:
                  number: 8080
          {{- if include "tinycrm.frontendNext.enabled" . }}
          # The React client (#122). In this Ingress, not its own, so basic
          # auth and noindex cover it too; the longer rule wins over / the same
          # way /api does. Prefix intact — the image serves from /srv/next.
          - path: /next
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-frontend-next
                port:
                  number: 8080
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $apiMiddlewares }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  # References the Secret the Ingress above causes cert-manager to fill. No
  # issuer annotation here, so no second Certificate is created for it.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Traefik prioritises Ingress routers by rule length, so /api wins
          # over / without any explicit priority.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-backend
                port:
                  number: 8000
{{- end }}
