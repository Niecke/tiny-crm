apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinycrm
  namespace: tinycrm
spec:
  interval: 5m
  # The released chart from GHCR, pinned in ocirepository.yaml — not
  # charts/tinycrm on main, which is staging's.
  chartRef:
    kind: OCIRepository
    name: tinycrm-chart
  # Off by default, which is why a manual `kubectl scale` on the backend
  # survived a suspend/resume cycle: without this, helm-controller only acts
  # when the chart revision or the values change, never on a live object being
  # edited underneath it. Enabled, the cluster is corrected back to the chart on
  # every interval.
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Credentials. This Secret is created once by hand and never lives in git —
  # see deploy/README.md. It carries the same YAML that a local
  # values-secrets.yaml would.
  valuesFrom:
    - kind: Secret
      name: tinycrm-values
      valuesKey: values.yaml
  # Inline values win over valuesFrom, so this is the deployment's own config.
  values:
    ingress:
      host: crm.niecke-it.de
    backend:
      image:
        # Written by release.yml from a vX.Y.Z tag — a merge to main never
        # moves production. Rolling back is reverting that Deploy commit.
        tag: 0.2.0
    frontend:
      image:
        tag: 0.2.0
    backup:
      image:
        tag: 0.2.0
