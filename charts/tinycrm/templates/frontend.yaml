apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tinycrm.fullname" . }}-frontend
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Derived from ingress.host so the two cannot drift. Phase 7's cutover is one
  # edit to that value and this follows it.
  config.json: |
    {
      "apiUrl": "https://{{ .Values.ingress.host }}/api"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tinycrm.fullname" . }}-frontend
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "tinycrm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tinycrm.fullname" . }}-frontend
  labels:
    {{- include "tinycrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "tinycrm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "tinycrm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        # config.json is baked into no layer — it is mounted, so a host change
        # has to roll the pods itself.
        checksum/config: {{ .Values.ingress.host | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # Same path the production compose file mounts it at.
            - name: config
              mountPath: /srv/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tinycrm.fullname" . }}-frontend
