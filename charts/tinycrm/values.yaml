nameOverride: ""
fullnameOverride: ""

# PriorityClass for every pod the chart creates, the CNPG instance included.
# Empty in production. Staging sets a negative one so that, when the shared
# node runs short of memory, the kubelet evicts staging pods before production.
priorityClassName: ""

# ---------------------------------------------------------------------------
# Database — a CloudNativePG Cluster, not a StatefulSet the chart owns.
# ---------------------------------------------------------------------------
postgres:
  # One instance. The cluster is a single node, so a second replica would land
  # on the same disk and buy no availability — only contention. Restarts are
  # therefore downtime; that is the accepted trade for this deployment.
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  database: crm
  username: crm
  # Required. `openssl rand -base64 24`
  password: ""

  storage:
    size: 10Gi
    # local-path binds a directory under the node's data volume. It does not
    # enforce this size — the number is documentation, and nothing stops
    # postgres from filling the node's 20 GB data volume.
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # postgresql.conf overrides, passed to CloudNativePG as strings. Empty keeps
  # the operator's defaults; staging lowers shared_buffers to fit its limit.
  parameters: {}

# ---------------------------------------------------------------------------
# Document store
# ---------------------------------------------------------------------------
# Hetzner Object Storage, outside the cluster. Replaced the in-cluster MinIO
# once MinIO stopped publishing images (#112). The bucket, its versioning and the
# key are set up by hand: infrastructure repo, MANUAL-STEPS.md §9.
s3:
  endpoint: https://nbg1.your-objectstorage.com
  # Hetzner checks the signing region, so this must match the endpoint's
  # location. us-east-1 is rejected.
  region: nbg1
  bucket: niecke-tinycrm-documents

  # Required. The `tinycrm-backend` key from the Cloud Console. A Hetzner key
  # reaches every bucket in the project, not only this one.
  accessKey: ""
  secretKey: ""

# ---------------------------------------------------------------------------
# Application — templates land in the next increment; values are here so the
# whole configuration surface can be reviewed in one place.
# ---------------------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/niecke/tiny-crm/backend
    # No default. Flux sets this to the promoted sha-<short> tag (see
    # deploy/flux/{staging,prod}/helmrelease.yaml); rendering without it fails on purpose.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1

  # production turns the insecure-default warnings in config.py into a hard
  # startup failure. Keep it.
  environment: production
  # Required. `openssl rand -hex 32`
  jwtSecret: ""

  # k3s allocates pod addresses from this range by default. uvicorn only honours
  # X-Forwarded-For from peers it trusts, and the peer is always Traefik — so
  # without this every user shares one address in the login throttle.
  forwardedAllowIps: 10.42.0.0/16

  # Transactional mail through Brevo: account invites (`python -m app.cli
  # create-user`) and password-reset links, which point at
  # https://<ingress.host>/reset-password, a page of the React frontend.
  # Optional — without brevoApiKey and fromAddress nothing is sent: a reset
  # request is logged and dropped, and the CLI refuses to invite.
  # Invites are sent by the CLI itself; reset links by the worker below, which
  # reads these same values.
  mail:
    # A bearer credential: it belongs in the cluster Secret, never in git.
    brevoApiKey: ""
    # A sender Brevo has verified, on a domain carrying Brevo's SPF/DKIM records.
    fromAddress: ""
    fromName: tinyCRM

  # Business card scanning: photos of a card are read by Claude through the
  # Anthropic API and turned into a contact and its company. Optional — without
  # a key the scan screen says scanning is not set up.
  businessCards:
    # A bearer credential: it belongs in the cluster Secret, never in git.
    anthropicApiKey: ""
    # The model that reads the cards. Not secret — set it under `values:` in the
    # HelmRelease (or in tinycrm-values); either way it rolls the backend pods
    # without a new image. claude-haiku-5-5 costs a fraction of this.
    model: claude-opus-5-5

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# The background worker: the backend image started as `python -m app.worker`.
# It runs the jobs the API defers — mail first (password-reset links), later
# anything too slow for a request. The queue lives in Postgres, so there is no
# broker to deploy.
#
# Mail is configured once, under backend.mail, and read by both.
# ---------------------------------------------------------------------------
worker:
  # Off means queued mail is never sent: a forgot-password still answers 202
  # and the job waits in the database for a worker.
  enabled: true
  # Set by hand. Any number is safe — jobs are claimed with SKIP LOCKED.
  replicas: 1

  # One pool per entry: `queues` it serves, `concurrency` jobs at once. A
  # pool's slots are its own, which is what keeps mail moving while a long job
  # occupies another pool. The `default` queue must be served by some pool:
  # the queue's own housekeeping runs there.
  pools:
    - name: mail
      queues: [mail]
      concurrency: 2
    - name: default
      queues: [default]
      concurrency: 1

  # How long a stopping pod may finish what it is running. Above the longest
  # task; the worker aborts what is left ten seconds before this runs out.
  terminationGracePeriodSeconds: 60

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # Shared by every pool: an out-of-memory kill in one takes the others
      # down until the pod is back. If that happens, split the pools.
      memory: 384Mi

# The React client, built from frontend-next/ (#122).
frontend:
  image:
    repository: ghcr.io/niecke/tiny-crm/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# ---------------------------------------------------------------------------
# The morning briefing: overdue tasks, today's plan and the sources due to be
# swept, posted to Slack so they are visible without an open browser tab.
#
# Off by default because it cannot work without a webhook URL, and a CronJob
# that fails every morning is worse than no CronJob. Turning it on means
# adding `briefing.slackWebhookUrl` to the credentials Secret (see
# deploy/README.md) in the same change.
# ---------------------------------------------------------------------------
briefing:
  enabled: true

  # Weekdays only — 1-5 is Monday to Friday. Early enough to be read before the
  # day starts, late enough not to arrive overnight.
  schedule: "0 7 * * 1-5"
  # Read as the schedule's zone *and* as the operator's day boundary, which is
  # what decides whether a task due at 23:59 counts as today.
  timeZone: Europe/Berlin

  # A run that could not start within ten minutes of its slot is skipped
  # rather than queued: yesterday's briefing is not worth delivering today.
  startingDeadlineSeconds: 600

  # Required when enabled. Slack → Apps → Incoming Webhooks → add to a channel.
  # A bearer credential: it belongs in the cluster Secret, never in git.
  slackWebhookUrl: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Off-site backup. One tar per run holding a brotli'd SQL dump and the raw
# documents, streamed to the GCS backups bucket over its S3 endpoint.
#
# Complements Hetzner's server snapshots rather than duplicating them: those are
# whole-machine, crash-consistent and never leave Hetzner. This is per-object,
# restorable into any stack, and lives at a different provider.
# ---------------------------------------------------------------------------
backup:
  enabled: true

  # Daily, not hourly. Every run copies the whole document store, and the
  # bucket's lifecycle rule keeps 14 days — hourly would mean 336 full copies.
  # Hourly with deduplication is a restic or borg job, not this one.
  schedule: "0 3 * * *"
  timeZone: Europe/Berlin

  image:
    repository: ghcr.io/niecke/tiny-crm/backup
    tag: ""
    pullPolicy: IfNotPresent

  # brotli's default of 11 costs minutes on two shared vCPUs for a few percent.
  brotliQuality: 5

  gcs:
    endpoint: https://storage.googleapis.com
    bucket: niecke-it-tiny-crm-backups
    # Required. Both from terraform/niecke-it:
    #   terraform output tiny_crm_backup_hmac_access_id
    #   terraform output tiny_crm_backup_hmac_secret
    accessKey: ""
    secretKey: ""

  # Scratch space for the dump plus a full copy of the documents. Comes off the
  # node's 40 GB boot disk, so it has to stay well under it.
  workDirSize: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

ingress:
  # The Ingress pair and the stripPrefix rule are Traefik-specific, so this
  # subtree cannot render on a cluster without Traefik's CRDs. Turn it off for a
  # restore drill or any other cluster reached by port-forward — host is still
  # read below, because the frontend's apiUrl derives from it either way.
  enabled: true
  className: traefik
  host: crm.niecke-it.de
  tls:
    enabled: true
    # cert-manager ClusterIssuer, installed as a cluster add-on.
    clusterIssuer: letsencrypt

  # X-Robots-Tag: noindex on every response. For non-production hosts.
  noindex: false

  # Basic auth in front of the frontend (not /api — see templates/ingress.yaml).
  # The name of a Secret in the release namespace holding htpasswd lines under
  # the key `users`. Empty turns it off.
  basicAuth:
    secretName: ""
