name: CI

# Pull requests into main run the whole pipeline: tests → build and push the
# images → start those exact images and drive one real workflow through them.
#
# Only pull_request, deliberately: while a PR is open, every push to dev fires
# `synchronize` on the same commit, so a push trigger would run everything
# twice. Open the PR as a draft as soon as work starts and dev commits are
# covered from the first push. workflow_dispatch runs the tests on demand.
#
# Branch protection on main should require: Backend tests, Frontend tests,
# Build backend, Build frontend, Integration test.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ghcr.io
  # GHCR rejects uppercase in a path, so this is not github.repository_owner.
  REGISTRY: ghcr.io/niecke/tiny-crm

jobs:
  # Chart, deploy manifests and documentation now live in this repo, and none of
  # them are exercised by anything below. Gating on a real diff keeps a
  # docs-only pull request from running two image builds and an integration
  # test.
  #
  # Deliberately a job-level `if:` on each consumer rather than a `paths:` filter
  # on the trigger: a workflow skipped by path filtering never reports its
  # checks, so the required checks in branch protection would sit Pending and
  # the pull request could never merge. A job skipped by `if:` reports a
  # `skipped` conclusion, which satisfies them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no pull request to diff — run everything.
          if [ -z "$BASE" ]; then
            echo "Manual run — nothing to filter on."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots compares against the merge base, so commits that landed
          # on main while this pull request was open are not mistaken for its
          # own changes. Captured to a variable rather than piped: `grep -q`
          # exits early, and under pipefail the resulting SIGPIPE on git would
          # fail the step.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "$changed"

          if echo "$changed" | grep -qE '^(backend/|frontend/|backup/|ci/|compose\.ci\.yml|\.github/workflows/ci\.yml)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Application code touched — running the full pipeline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No application code changed — tests, builds and the integration test are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The sha under test. For a pull_request event github.sha is the ephemeral
  # merge commit, which no image should ever be tagged with — the promote
  # workflow looks images up by the PR head sha after the merge.
  meta:
    name: Resolve build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      tag: ${{ steps.id.outputs.tag }}
    steps:
      - id: id
        run: |
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${commit:0:7}" >> "$GITHUB_OUTPUT"

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The suite runs against a real Postgres — the models use text[], ilike and
    # timestamptz, so SQLite would not exercise them honestly. Each run creates
    # and drops its own scratch database on this server.
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        working-directory: backend
        # Tests included: they are the code most likely to drift from the app's
        # own types, and mypy strict catches that for free.
        run: uv run mypy app tests

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/postgres
        run: |
          uv run pytest -q \
            --junitxml=junit.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload reports
        # The report job needs these precisely when the tests failed.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/junit.xml
            backend/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-tests:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same SDK digest the frontend image builds with (see frontend/Dockerfile),
    # so the gate cannot pass on a different Flutter than the one that ships.
    container:
      image: ghcr.io/adrianjagielak/flutter:3.47.2@sha256:083e197fd1382da5d8da14a0f9dfef7ae11b44e00f26e977ddd30d5897c81d51
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        # widget_test.dart is @TestOn('browser') and is skipped here; the unit
        # tests run on the VM.
        run: flutter test --coverage --file-reporter=json:test-results.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/test-results.json
            frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Test report
    needs: [changes, backend-tests, frontend-tests]
    # Runs even when a suite failed — that is when the summary is worth reading.
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A suite that died before writing a report leaves nothing to download;
      # the summary says so rather than the job failing here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: reports
          merge-multiple: true

      - name: Render the summary
        run: |
          mkdir -p reports
          python3 ci/pr_report.py \
            --backend-junit reports/junit.xml \
            --backend-coverage reports/coverage.xml \
            --frontend-report reports/test-results.json \
            --frontend-coverage reports/coverage/lcov.info \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Marker keeps one comment per PR: find it, edit it, or post the first.
          printf '\n<!-- tinycrm-test-report -->\n' >> comment.md
          comment_id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- tinycrm-test-report -->"))] | last | .id // empty')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              -F body=@comment.md > /dev/null
            echo "Updated comment $comment_id"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@comment.md > /dev/null
            echo "Posted a new comment"
          fi

  build-backend:
    name: Build backend
    needs: [changes, meta, backend-tests, frontend-tests]
    # A fork PR's GITHUB_TOKEN is read-only whatever this block asks for, and a
    # manual run has no PR head to tag images with — both fall back to running
    # the tests only.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.meta.outputs.commit }}
          # image.source is what makes GHCR link the package to this repository.
          # Without it the package is owned by whoever pushed first and
          # GITHUB_TOKEN loses write access on the next run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
          tags: ${{ env.REGISTRY }}/backend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend
    needs: [changes, meta, backend-tests, frontend-tests]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
          tags: ${{ env.REGISTRY }}/frontend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Built alongside the others so all three images always exist at the same
  # ci-<sha>: promote checks for the whole set before retagging any of it, and a
  # partially-built tag would make it skip the release entirely.
  build-backup:
    name: Build backup
    needs: [changes, meta, backend-tests, frontend-tests]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backup
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
          tags: ${{ env.REGISTRY }}/backup:${{ needs.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration test
    needs: [changes, meta, build-backend, build-frontend]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the stack and drive it
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.meta.outputs.commit }}
        run: ci/smoke.sh

      # compose.ci.yml refuses to interpolate without these; the values are
      # irrelevant for reading logs and tearing the stack down.
      - name: Container logs
        if: failure()
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          JWT_SECRET: unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
        run: docker compose -p tinycrm-ci -f compose.ci.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          JWT_SECRET: unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
        run: docker compose -p tinycrm-ci -f compose.ci.yml down -v
