services:
  db:
    image: docker.io/library/postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm -d crm" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 fixture. Versity Gateway (Apache-2.0) in posix mode: one static binary
  # that stores objects as files and supports bucket versioning, so the backend's
  # startup check passes the way it does against Hetzner in production. Replaced
  # MinIO, which stopped publishing images (#112).
  s3:
    image: docker.io/versity/versitygw:v1.10.0@sha256:2df780de109d16491cb99c25f4c0bc9085b286e77b5b47b56121b340094e70bb
    # The entrypoint builds the command from VGW_* variables; the directories
    # have to exist before the gateway starts.
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /data/buckets /data/versions && exec /usr/local/bin/docker-entrypoint.sh"]
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/buckets
      VGW_VERSIONING_DIR: /data/versions
      VGW_HEALTH: /health
      VGW_QUIET: "true"
    ports:
      # 9000 on the host so backend/.env.example's S3_ENDPOINT_URL keeps working.
      - "9000:7070"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and turns versioning on. Both steps are idempotent.
  s3-init:
    image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENDPOINT: http://s3:7070
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: minioadmin
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: minioadmin
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rclone mkdir s3:tinycrm-documents
        rclone backend versioning s3:tinycrm-documents Enabled

volumes:
  postgres_data:
  s3_data:
