name: Release please

# Keeps one release pull request open against main. It collects the conventional
# commits since the last tag, bumps the version in every file listed in
# release-please-config.json and prepends them to CHANGELOG.md. Merging that pull
# request tags vX.Y.Z and publishes the GitHub Release — the merge is the release
# decision.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Not GITHUB_TOKEN. GitHub does not start workflows for events that token
      # causes, so a release pull request opened with it would never run ci.yml
      # and its required checks would sit Pending forever — and the tag it pushes
      # would never trigger a tag workflow. RELEASE_PLEASE_TOKEN is a fine-grained
      # PAT on this repository with contents and pull-requests read/write.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
