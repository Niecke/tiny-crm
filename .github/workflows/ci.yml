name: CI

# Pull requests into main run the whole pipeline: tests → build and push the
# images → start those exact images and drive one real workflow through them.
#
# Only pull_request, deliberately: while a PR is open, every push to dev fires
# `synchronize` on the same commit, so a push trigger would run everything
# twice. Open the PR as a draft as soon as work starts and dev commits are
# covered from the first push. workflow_dispatch runs the tests on demand.
#
# Branch protection on main should require: Backend tests, Frontend tests,
# Build backend, Build frontend, Integration test.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: europe-west1-docker.pkg.dev
  REGISTRY: europe-west1-docker.pkg.dev/niecke-it/tiny-crm

jobs:
  # The sha under test. For a pull_request event github.sha is the ephemeral
  # merge commit, which no image should ever be tagged with — the promote
  # workflow looks images up by the PR head sha after the merge.
  meta:
    name: Resolve build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      tag: ${{ steps.id.outputs.tag }}
    steps:
      - id: id
        run: |
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${commit:0:7}" >> "$GITHUB_OUTPUT"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The suite runs against a real Postgres — the models use text[], ilike and
    # timestamptz, so SQLite would not exercise them honestly. Each run creates
    # and drops its own scratch database on this server.
    services:
      postgres:
        image: postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        working-directory: backend
        # Tests included: they are the code most likely to drift from the app's
        # own types, and mypy strict catches that for free.
        run: uv run mypy app tests

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/postgres
        run: |
          uv run pytest -q \
            --junitxml=junit.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload reports
        # The report job needs these precisely when the tests failed.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/junit.xml
            backend/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same SDK digest the frontend image builds with (see frontend/Dockerfile),
    # so the gate cannot pass on a different Flutter than the one that ships.
    container:
      image: ghcr.io/cirruslabs/flutter:stable@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        # widget_test.dart is @TestOn('browser') and is skipped here; the unit
        # tests run on the VM.
        run: flutter test --coverage --file-reporter=json:test-results.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/test-results.json
            frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Test report
    needs: [backend-tests, frontend-tests]
    # Runs even when a suite failed — that is when the summary is worth reading.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # A suite that died before writing a report leaves nothing to download;
      # the summary says so rather than the job failing here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: reports
          merge-multiple: true

      - name: Render the summary
        run: |
          mkdir -p reports
          python3 ci/pr_report.py \
            --backend-junit reports/junit.xml \
            --backend-coverage reports/coverage.xml \
            --frontend-report reports/test-results.json \
            --frontend-coverage reports/coverage/lcov.info \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Marker keeps one comment per PR: find it, edit it, or post the first.
          printf '\n<!-- tinycrm-test-report -->\n' >> comment.md
          comment_id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- tinycrm-test-report -->"))] | last | .id // empty')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              -F body=@comment.md > /dev/null
            echo "Updated comment $comment_id"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@comment.md > /dev/null
            echo "Posted a new comment"
          fi

  build-backend:
    name: Build backend
    needs: [meta, backend-tests, frontend-tests]
    # Fork PRs cannot read the WIF secrets, and a manual run has no PR head to
    # tag images with — both fall back to running the tests only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.meta.outputs.commit }}
          tags: ${{ env.REGISTRY }}/backend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend
    needs: [meta, backend-tests, frontend-tests]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.meta.outputs.commit }}
          tags: ${{ env.REGISTRY }}/frontend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration test
    needs: [meta, build-backend, build-frontend]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Run the stack and drive it
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.meta.outputs.commit }}
        run: ci/smoke.sh

      # compose.ci.yml refuses to interpolate without these; the values are
      # irrelevant for reading logs and tearing the stack down.
      - name: Container logs
        if: failure()
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          JWT_SECRET: unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
        run: docker compose -p tinycrm-ci -f compose.ci.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.tag }}
          JWT_SECRET: unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
        run: docker compose -p tinycrm-ci -f compose.ci.yml down -v
