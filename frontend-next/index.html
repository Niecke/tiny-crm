<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebe4d6" />
    <!-- Installable app with an Android share target (public/manifest.json).
         use-credentials: staging sits behind basic auth, and a manifest is
         otherwise fetched without the browser's saved credentials. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- react-aria's usePress injects this one rule as an inline <style>,
         which the Content-Security-Policy refuses (#155). It skips the
         injection when an element with this id exists, so the same rule
         ships as a file of our own instead. -->
    <link rel="stylesheet" id="react-aria-pressable-style" href="/react-aria-pressable.css" />
    <title>tinyCRM</title>
    <!-- Before the app's modules: see the file. -->
    <script src="/zod-jitless.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
