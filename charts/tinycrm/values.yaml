nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Database — a CloudNativePG Cluster, not a StatefulSet the chart owns.
# ---------------------------------------------------------------------------
postgres:
  # One instance. The cluster is a single node, so a second replica would land
  # on the same disk and buy no availability — only contention. Restarts are
  # therefore downtime; that is the accepted trade for this deployment.
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  database: crm
  username: crm
  # Required. `openssl rand -base64 24`
  password: ""

  storage:
    size: 10Gi
    # local-path binds a directory under the node's data volume. It does not
    # enforce this size — the number is documentation, and postgres and MinIO
    # share the same 20 GB volume with nothing stopping either from filling it.
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Document store
# ---------------------------------------------------------------------------
minio:
  # Digest-pinned the same way compose.yml pins it.
  image: docker.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  mcImage: docker.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727

  bucket: tinycrm-documents

  # Required, and they must not be minioadmin: the backend refuses to start in
  # production on the demo credentials (backend/app/config.py).
  rootUser: ""
  rootPassword: ""

  storage:
    size: 5Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Application — templates land in the next increment; values are here so the
# whole configuration surface can be reviewed in one place.
# ---------------------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/niecke/tiny-crm/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1

  # production turns the insecure-default warnings in config.py into a hard
  # startup failure. Keep it.
  environment: production
  # Required. `openssl rand -hex 32`
  jwtSecret: ""

  s3Region: us-east-1

  # k3s allocates pod addresses from this range by default. uvicorn only honours
  # X-Forwarded-For from peers it trusts, and the peer is always Traefik — so
  # without this every user shares one address in the login throttle.
  forwardedAllowIps: 10.42.0.0/16

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/niecke/tiny-crm/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# ---------------------------------------------------------------------------
# Off-site backup. One tar per run holding a brotli'd SQL dump and the raw
# documents, streamed to the GCS backups bucket over its S3 endpoint.
#
# Complements Hetzner's server snapshots rather than duplicating them: those are
# whole-machine, crash-consistent and never leave Hetzner. This is per-object,
# restorable into any stack, and lives at a different provider.
# ---------------------------------------------------------------------------
backup:
  enabled: true

  # Daily, not hourly. Every run copies the whole document store, and the
  # bucket's lifecycle rule keeps 14 days — hourly would mean 336 full copies.
  # Hourly with deduplication is a restic or borg job, not this one.
  schedule: "0 3 * * *"
  timeZone: Europe/Berlin

  image:
    repository: ghcr.io/niecke/tiny-crm/backup
    tag: latest
    pullPolicy: IfNotPresent

  # brotli's default of 11 costs minutes on two shared vCPUs for a few percent.
  brotliQuality: 5

  gcs:
    endpoint: https://storage.googleapis.com
    bucket: niecke-it-tiny-crm-backups
    # Required. Both from terraform/niecke-it:
    #   terraform output tiny_crm_documents_hmac_access_id
    #   terraform output tiny_crm_documents_hmac_secret
    accessKey: ""
    secretKey: ""

  # Scratch space for the dump plus a full copy of the documents. Comes off the
  # node's 40 GB boot disk, so it has to stay well under it.
  workDirSize: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

ingress:
  # The Ingress pair and the stripPrefix rule are Traefik-specific, so this
  # subtree cannot render on a cluster without Traefik's CRDs. Turn it off for a
  # restore drill or any other cluster reached by port-forward — host is still
  # read below, because the frontend's apiUrl derives from it either way.
  enabled: true
  className: traefik
  host: crm.niecke-it.de
  tls:
    enabled: true
    # cert-manager ClusterIssuer, installed as a cluster add-on.
    clusterIssuer: letsencrypt
