<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
</head>

<body
    style="margin:0;padding:24px;background:#f5f5f4;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;">
        <tr>
            <td style="padding:32px;">
                <p style="margin:0 0 16px;">Hello{% if name %} {{ name }}{% endif %},</p>
                {% block content %}{% endblock %}
                <p style="margin:24px 0 0;font-size:13px;color:#57534e;">If the button does not work, copy this link
                    into your browser:<br>
                    <a href="{{ link }}" style="color:#57534e;word-break:break-all;">{{ link }}</a>
                </p>
            </td>
        </tr>
    </table>
</body>

</html>
