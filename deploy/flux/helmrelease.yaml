apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinycrm
  namespace: tinycrm
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/tinycrm
      sourceRef:
        kind: GitRepository
        name: tinycrm
      # Without this, Flux only redeploys when Chart.yaml's version changes, so
      # a template edit merged without a version bump would sit in git and never
      # reach the cluster. Revision keys off the git commit instead.
      reconcileStrategy: Revision
  # Off by default, which is why a manual `kubectl scale` on the backend
  # survived a suspend/resume cycle: without this, helm-controller only acts
  # when the chart revision or the values change, never on a live object being
  # edited underneath it. Enabled, the cluster is corrected back to the chart on
  # every interval.
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Credentials. This Secret is created once by hand and never lives in git —
  # see deploy/README.md. It carries the same YAML that a local
  # values-secrets.yaml would.
  valuesFrom:
    - kind: Secret
      name: tinycrm-values
      valuesKey: values.yaml
  # Inline values win over valuesFrom, so this is the deployment's own config.
  values:
    ingress:
      host: crm.niecke-it.de
    backend:
      image:
        # Managed by .github/workflows/promote.yml — do not edit by hand.
        tag: c1d9797
    frontend:
      image:
        tag: c1d9797
    backup:
      image:
        # No image at 077ae28 — that promote predates this one existing. promote
        # sets all three to the merge sha on the next release.
        tag: c1d9797
